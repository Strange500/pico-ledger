[package]
edition = "2021"
name = "pico-ledger"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"

# We're using a Pico by default on this template
ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
panic-halt = "1.0.0"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "rp235xa", "binary-info", "defmt"] }
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-firmware = { version = "0.1.0", features = ["wifi"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
static_cell = "2.1.0"
heapless = "0.9.3"

# but you can use any BSP.
# If you're not going to use a Board Support Package you'll need these:
# rp235x-hal = { version="0.3", features=["rt", "critical-section-impl"] }
# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
