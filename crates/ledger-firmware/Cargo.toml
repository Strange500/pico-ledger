[package]
name = "ledger-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
ledger-core = { path = "../ledger-core" }
bitcoin = { version = "0.32.102", default-features = false }
bip39 = { version = "=3.0.0", default-features = false }
buoyant = "0.7.1"
cortex-m-rt = "0.7"
ssd1306 = { version = "0.10.0", features = ["async"] }
embedded-graphics = "0.8.2"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
panic-probe = { version = "0.3", features = ["print-defmt"] }
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "rp235xa", "binary-info", "defmt"] }
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-firmware = { version = "0.1.0", features = ["wifi"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
static_cell = "2.1.0"
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-usb-logger = "0.6.0"
log = "0.4.34"
embedded-alloc = "0.7.0"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hmac = { version = "0.13.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = { version = "0.11.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["zeroize_derive"] }
