name: CI Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit Tests (Host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run portable core unit tests
        run: cargo test --locked -p pico-ledger-core --target x86_64-unknown-linux-gnu
      - name: Run public-key PSBT demo tests
        run: cargo test --locked -p pico-ledger-core --target x86_64-unknown-linux-gnu --features psbt-demo

  core-lint:
    name: Core Clippy (Host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked -p pico-ledger-core --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - run: cargo clippy --locked -p pico-ledger-core --target x86_64-unknown-linux-gnu --all-targets --all-features -- -D warnings

  demo-firmware:
    name: Public-key demo firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: thumbv8m.main-none-eabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: flip-link
      - run: cargo build --locked -p pico-ledger --features psbt-demo
      - run: cargo build --locked -p pico-ledger --features psbt-demo --release

  building:
    name: Firmware Build (${{ matrix.os }}, ${{ matrix.rust }})
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      matrix:
        rust: [stable, nightly]
        include:
          - rust: nightly
            experimental: true
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: thumbv8m.main-none-eabihf
      - name: Install flip-link
        uses: taiki-e/install-action@v2
        with:
          tool: flip-link
      - name: Build debug
        run: cargo build --locked -p pico-ledger
      - name: Build release
        run: cargo build --locked -p pico-ledger --release

  linting:
    name: Linting (Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          target: thumbv8m.main-none-eabihf
      - name: Run clippy
        run: cargo clippy --all-features -- --deny=warnings

  formatting:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          target: thumbv8m.main-none-eabihf
      - name: Check code formatting
        run: cargo fmt --all -- --check
