[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Choose a default "cargo run" tool (see README for more info)
# - `probe-rs` provides flashing and defmt via a hardware debugger, and stack unwind on panic
# - `picotool` loads firmware over USB when the rp2350 is in boot mode
# runner = "probe-rs run --chip RP235x --protocol swd"
# runner = "picotool load --update --verify --execute -t elf"
runner = "probe-rs run --chip RP235x --protocol swd"
linker = "flip-link"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[build]
target = "thumbv8m.main-none-eabihf"

[alias]
test-host = "test --target x86_64-unknown-linux-gnu"
ui = "run --package ui --target x86_64-unknown-linux-gnu"
check-ui = "check --package ui --target x86_64-unknown-linux-gnu"

[env]
DEFMT_LOG = "debug"
CC_thumbv8m_main_none_eabihf = "clang"
